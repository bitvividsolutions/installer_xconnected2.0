apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-db
  namespace: xconnected
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-db
  template:
    metadata:
      labels:
        app: config-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: "itmsmainindore"
      containers:
      - name: postgres
        image: postgres:16
        env:
          - name: POSTGRES_DB
            value: postgres
          - name: POSTGRES_USER
            value: postgres
          - name: POSTGRES_PASSWORD
            value: postgres
        volumeMounts:
          - name: postgres2-storage
            mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres2-storage
          persistentVolumeClaim:
            claimName: config-db-pvc
